otId(time)}">${time}</span>`).join('')}${x.kind==='weekly'?`<span class="stock-card-desc">· ${(x.days||[]).map(d=>['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d]).join(', ')}</span>`:''}</div>${x.instructions?`<div class="stock-card-desc"><strong>Orientação do quadro:</strong> ${esc(x.instructions)}</div>`:''}</div><div class="stock-count">${x.stock==null?'Estoque não informado':`${x.stock} ${unit(x)}`}<div class="progress-copy">${x.paused?'Pausado temporariamente':x.stock==null?'Informe a quantidade física':x.kind==='temporary'?`Dia ${treatment(x).day} de ${x.duration}`:`Acaba em ${shortDate(forecast(x)?.last)}`}</div></div><div class="actions"><button class="btn btn-small" data-toggle="${x.id}">${x.paused?'Retomar':'Pausar'}</button><button class="icon-btn" aria-label="Editar ${x.name}" data-edit="${x.id}">${svg('edit')}</button><button class="icon-btn" aria-label="Excluir ${x.name}" data-delete="${x.id}">${svg('trash')}</button></div></article>`)}</div></div><div class="notice">As doses, observações e momentos refletem o quadro enviado. Não são uma recomendação clínica; confirme ajustes com a profissional de saúde.</div>`}
function boardView(){let daily=state.items.filter(x=>x.kind!=='sos'),entry=x=>`<article class="board-item"><strong>${esc(x.name)}${x.paused?' · Pausado temporariamente':''}</strong><small>${esc(x.detail||'')}${x.dose?` · ${x.dose} ${x.unit||'unidades'} por tomada`:''}</small><small><b>Para que serve:</b> ${esc(x.purpose||'Finalidade não indicada no quadro enviado.')}</small>${x.instructions?`<small><b>Orientação:</b> ${esc(x.instructions)}</small>`:''}</article>`,groups=SLOTS.map(s=>({id:s.id,label:s.label,items:daily.filter(x=>x.scheduleMode==='slots'&&(x.slots||[]).includes(s.id))})).filter(g=>g.items.length),weekly= daily.filter(x=>x.kind==='weekly'&&!(x.slots||[]).length);let timed=daily.filter(x=>x.scheduleMode==='clock'&&(x.times||[]).length),sos=state.items.filter(x=>x.kind==='sos');if(weekly.length)groups.push({id:'other',label:'Uso semanal',items:weekly});if(timed.length)groups.push({id:'other',label:'Horários específicos',items:timed});return `<div class="panel page-panel"><div class="table-head"><div><div class="section-heading" style="margin:0"><div><h3>Quadro visual da prescrição</h3><p>Organizado por momento do dia, conforme as cores do quadro enviado.</p></div></div></div><div class="board-toolbar"><button class="btn" data-view="routine">${svg('arrow')} Voltar à prescrição</button><button class="btn btn-primary" id="pdf-board">${svg('calendar')} Salvar em PDF</button></div></div><div class="board-wrap">${groups.map(g=>`<section class="board-section board-${g.id}"><h3>${g.label}</h3><div class="board-items">${g.items.map(entry).join('')}</div></section>`).join('')}${sos.length?`<section class="board-section board-other"><h3>Uso sob demanda (SOS)</h3><div class="board-items">${sos.map(x=>`<article class="board-item"><strong>${esc(x.name)}</strong><small>${esc(x.detail||'')} · ${esc(x.indication||'Indicação não informada')}</small><small>${x.dose} ${esc(x.unit||'unidades')} por tomada · intervalo mínimo de ${x.interval}h · limite ${x.max24} em 24h</small></article>`).join('')}</div></section>`:''}</div><div class="security-note">As finalidades e orientações foram transcritas do quadro enviado. “Finalidade não indicada” significa que o quadro não informa esse dado. Confirme qualquer alteração com a prescrição atual.</div></div>`}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){save();let title=view==='home'?'Bom dia, família':view==='stock'?'Estoque e reposição':view==='board'?'Quadro visual da prescrição':'Prescrição e rotina',sub=view==='home'?'A rotina da Dona Ju, organizada com carinho.':view==='stock'?'Acompanhe quantidades e prazos de compra.':view==='board'?'Uma versão organizada e pronta para guardar ou imprimir.':'Confira e ajuste os itens conforme a prescrição atual.',content=view==='home'?home():view==='stock'?stockView():view==='board'?boardView():routineView();document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandmark">${svg('leaf')}</div><div><h1>Cuidados da Dona Ju</h1><small>Rotina em família</small></div></div><div><div class="nav-label">Acompanhamento</div><nav class="nav">${[['home','home','Resumo do dia'],['stock','box','Estoque e compras'],['routine','clipboard','Prescrição'],['board','clipboard','Quadro visual']].map(([id,ic,label])=>`<button class="${view===id?'active':''}" data-view="${id}">${svg(ic)} ${label}</button>`).join('')}</nav></div><div class="side-note"><strong>${svg('heart')} Um lembrete carinhoso</strong>Rotina organizada, cuidado compartilhado. Confira a prescrição antes de qualquer ajuste.</div><div class="side-footer">Dados guardados neste navegador</div></aside><main class="main"><header class="topbar"><div class="mobile-brand"><div class="brandmark">${svg('leaf')}</div><strong>Cuidados da Dona Ju</strong></div><div class="today-line">${svg('calendar')} ${fmtDate(state.simDate,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class="top-actions"><button class="btn btn-primary" id="top-add">${svg('plus')} Novo item</button></div></header><div class="page-title"><div><h2>${title}</h2><p>${sub}</p></div><div class="date-pill">${svg('calendar')} ${fmtDate(state.simDate,{day:'2-digit',month:'short',year:'numeric'}).replace('.','')}</div></div><div id="content">${content}</div></main></div><nav class="bottomnav">${[['home','home','Hoje'],['stock','box','Estoque'],['routine','clipboard','Prescrição'],['board','clipboard','Quadro']].map(([id,ic,label])=>`<button class="${view===id?'active':''}" data-view="${id}">${svg(ic)}${label}</button>`).join('')}</nav><div id="modal-root"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>`;bind()}
const EDIT_HASH_KEY='cuidado-da-vo-edit-hash',EDIT_SESSION_KEY='cuidado-da-vo-edit-unlocked';async function passwordDigest(text){if(!globalThis.crypto?.subtle)throw new Error('A proteção por senha exige uma conexão segura (HTTPS).');let bytes=new TextEncoder().encode(text),digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(v=>v.toString(16).padStart(2,'0')).join('')}function requestEditPassword(setup){return new Promise(resolve=>{let root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop" id="password-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="password-title"><div class="modal-head"><div><h3 id="password-title">${setup?'Criar senha de edição':'Confirmar responsável'}</h3><p>${setup?'Defina uma senha para proteger as alterações neste navegador.':'Digite a senha para liberar as alterações nesta sessão.'}</p></div><button class="icon-btn" id="password-close" aria-label="Cancelar">${svg('close')}</button></div><form id="password-form"><div class="form-grid"><div class="field full"><label for="edit-password">${setup?'Nova senha':'Senha de edição'}</label><input id="edit-password" type="password" autocomplete="${setup?'new-password':'current-password'}" required minlength="4" autofocus></div>${setup?'<div class="field full"><label for="edit-password-confirm">Confirme a senha</label><input id="edit-password-confirm" type="password" autocomplete="new-password" required minlength="4"></div>':''}</div><div class="notice" id="password-error" style="display:none"></div><div class="security-note">A senha fica vinculada a este navegador; ela não cria uma conta nem substitui proteção de acesso ao dispositivo.</div><div class="form-footer"><button type="button" class="btn" id="password-cancel">Cancelar</button><button class="btn btn-primary" type="submit">${setup?'Criar e liberar':'Liberar alterações'}</button></div></form></section></div>`;let done=false,finish=value=>{if(done)return;done=true;root.replaceChildren();resolve(value)};document.getElementById('password-close').onclick=()=>finish(false);document.getElementById('password-cancel').onclick=()=>finish(false);document.getElementById('password-backdrop').onclick=e=>{if(e.target.id==='password-backdrop')finish(false)};document.getElementById('password-form').onsubmit=async e=>{e.preventDefault();let pass=document.getElementById('edit-password').value,err=document.getElementById('password-error');try{if(setup){if(pass.length<4){err.textContent='Use pelo menos 4 caracteres.';err.style.display='block';return}if(pass!==document.getElementById('edit-password-confirm').value){err.textContent='As senhas não conferem.';err.style.display='block';return}localStorage.setItem(EDIT_HASH_KEY,await passwordDigest(pass))}else if(await passwordDigest(pass)!==localStorage.getItem(EDIT_HASH_KEY)){err.textContent='Senha incorreta. Tente novamente.';err.style.display='block';document.getElementById('edit-password').select();return}sessionStorage.setItem(EDIT_SESSION_KEY,'ok');finish(true)}catch(error){err.textContent=error.message||'Não foi possível validar a senha.';err.style.display='block'}};setTimeout(()=>document.getElementById('edit-password')?.focus(),0)})}async function withEditAccess(action){if(sessionStorage.getItem(EDIT_SESSION_KEY)==='ok'){action();return}let ok=await requestEditPassword(!localStorage.getItem(EDIT_HASH_KEY));if(ok)action()}function toast(msg){let el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2600)}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;searchTerm='';render()});document.querySelectorAll('[data-replenish]').forEach(b=>b.onclick=()=>withEditAccess(()=>replenish(b.dataset.replenish)));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>withEditAccess(()=>openForm(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>withEditAccess(()=>removeItem(b.dataset.delete)));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>withEditAccess(()=>{let x=getItem(b.dataset.toggle),next=!x.paused,stamp=todayISO();x.paused=next;x.pausedAt=next?stamp:'';x.pauseHistory=[...(x.pauseHistory||[]),{action:next?'paused':'resumed',date:stamp,timestamp:Date.now()}];render();toast(next?'Item pausado temporariamente':'Item retomado')}));document.querySelectorAll('[data-dose]').forEach(b=>b.onclick=()=>withEditAccess(()=>recordDose(b.dataset.dose)));document.querySelectorAll('[data-whatsapp]').forEach(b=>b.onclick=sendWhatsApp);let add=document.getElementById('add-item'),top=document.getElementById('top-add');if(add)add.onclick=()=>withEditAccess(()=>openForm());if(top)top.onclick=()=>withEditAccess(()=>openForm());let pdf=document.getElementById('pdf-prescription');if(pdf)pdf.onclick=()=>{view='board';render();setTimeout(()=>window.print(),180)};let pdfBoard=document.getElementById('pdf-board');if(pdfBoard)pdfBoard.onclick=()=>window.print();let copy=document.getElementById('copy-list');if(copy)copy.onclick=copyShopping;let search=document.getElementById('search');if(search)search.oninput=()=>{let p=search.selectionStart;searchTerm=search.value;let y=window.scrollY;render();let el=document.getElementById('search');el.focus();el.setSelectionRange(p,p);window.scrollTo(0,y)}}
function replenish(id){let x=getItem(id),unknown=x.stock==null,answer=prompt(unknown?`Quantas ${unit(x)} há disponíveis agora para ${x.name}?`:`Quantas ${unit(x)} deseja adicionar a ${x.name}?`,unknown?'':'30');if(answer===null)return;let n=Number(answer);if(!Number.isFinite(n)||n<0||(!unknown&&n===0)){toast('Informe uma quantidade válida.');return}x.stock=unknown?n:x.stock+n;render();toast(unknown?'Estoque informado.':'Estoque atualizado.')}
function recordDose(id){let x=getItem(id),logs=(x.lastDoses||[]).filter(t=>Date.now()-t<86400000),last=logs.at(-1),wait=last?last+x.interval*3600000-Date.now():0;if(wait>0){toast(`Aguarde até ${new Date(last+x.interval*3600000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}.`);return}if(logs.length>=x.max24){toast(`Limite de ${x.max24} doses em 24 horas atingido.`);return}if(x.stock<x.dose){toast('Estoque insuficiente.');return}if(!confirm(`Confirmar ${x.dose} ${unit(x)} de ${x.name} agora?`))return;x.stock-=x.dose;x.lastDoses=[...(x.lastDoses||[]),Date.now()];render();toast('Dose registrada e estoque atualizado.')}
function shoppingList(){return sortItems(state.items.filter(x=>x.stock!=null&&(x.kind==='sos'?x.stock<=x.minStock:!x.paused&&forecast(x)?.days<=x.lead)))}
function copyShopping(){let list=shoppingList();if(!list.length){toast('Nenhum item com estoque informado está perto do prazo de compra.');return}let text=`Lista de compras — Cuidados da Dona Ju\n${list.map(x=>`• ${x.name} — ${x.stock} ${unit(x)} restantes${x.kind==='sos'?' (SOS)':` · acaba em ${shortDate(forecast(x)?.last)}${x.popular&&x.popularDate?` · Farmácia Popular em ${shortDate(x.popularDate)}`:''}`}`).join('\n')}`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('Lista copiada para compartilhar.')).catch(()=>prompt('Copie a lista:',text));else prompt('Copie a lista:',text)}
function sendWhatsApp(){let list=shoppingList(),message=`Cuidados da Dona Ju — aviso de reposição\n${list.length?list.map(x=>`• ${x.name}: ${x.stock} ${unit(x)} restantes${x.kind==='sos'?'':` — previsão de término ${shortDate(forecast(x)?.last)}${x.popular&&x.popularDate?` — Farmácia Popular disponível ${shortDate(x.popularDate)}`:''}`}`).join('\n'):'Confira os estoques no painel; ainda não há quantidades informadas.'}\n\nMensagem preparada pelo painel. Confirme a quantidade antes da compra.`;if(!state.buyerPhone){let entered=prompt('Telefone do familiar responsável com DDD (opcional). Deixe vazio para escolher o contato no WhatsApp:','');if(entered===null)return;state.buyerPhone=entered.replace(/\D/g,'');save()}let phone=(state.buyerPhone||'').replace(/\D/g,'');window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`,'_blank','noopener,noreferrer')}
function removeItem(id){let x=getItem(id);if(confirm(`Excluir ${x.name} da rotina?`)){state.items=state.items.filter(i=>i.id!==id);render();toast('Item removido.')}}

option value="herbal" ${x?.category==='herbal'?'selected':''}>Fitoterápico</option></select></div><div class="field" id="control-class-field"><label for="controlStatus">Classificação da receita</label><select id="controlStatus" name="controlStatus"><option value="pending" ${(x?.controlStatus||'pending')==='pending'?'selected':''}>A confirmar</option><option value="controlled" ${x?.controlStatus==='controlled'?'selected':''}>Retém receita</option><option value="noncontrolled" ${x?.controlStatus==='noncontrolled'?'selected':''}>Não controlado</option></select><small>Essa classificação organiza o item nos quadrantes de Medicações do estoque.</small></div><div class="field full" id="popular-field"><label><input id="popular" name="popular" type="checkbox" ${x?.popular?'checked':''} style="width:auto;margin-right:7px">Retirado pela Farmácia Popular</label><small>Marque apenas se confirmado e informe a data de disponibilidade abaixo.</small></div><div class="field hidden" id="popular-date-field"><label for="popularDate">Data de disponibilidade na Farmácia Popular</label><input type="date" id="popularDate" name="popularDate" value="${x?.popularDate||''}"></div><div class="field"><label for="stock">Estoque atual</label><input id="stock" name="stock" type="number" min="0" step="1" value="${x?.stock??''}" placeholder="Deixe em branco se não conferiu"><small>Sem quantidade informada, não estimamos término ou compra.</small></div><div class="field"><label for="dose">Quantidade por tomada</label><input id="dose" name="dose" type="number" min="0.1" step="0.1" value="${x?.dose??1}" required></div><div id="schedule-fields" class="field full"><div class="form-grid"><div class="field"><label for="scheduleMode">Organizar horários por</label><select id="scheduleMode" name="scheduleMode"><option value="slots" ${(x?.scheduleMode||'slots')==='slots'?'selected':''}>Momento do dia</option><option value="clock" ${x?.scheduleMode==='clock'?'selected':''}>Horário exato</option></select></div><div class="field" id="times-field"><label for="times">Horários (HH:MM separados por vírgula)</label><input id="times" name="times" value="${esc((x?.times||[]).join(', '))}" placeholder="08:00, 20:00"></div><div class="field full" id="slots-field"><label>Momentos do dia</label><div class="weekdays">${SLOTS.map(s=>`<label class="weekday"><input type="checkbox" name="slots" value="${s.id}" ${(x?.slots||[]).includes(s.id)?'checked':''}><span>${s.label}</span></label>`).join('')}</div><small>O quadro usa refeições e momentos; somente 14:00 é indicado como horário sugerido.</small></div><div class="field full" id="days-field"><label>Dias da semana</label><div class="weekdays">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map((d,i)=>`<label class="weekday"><input type="checkbox" name="days" value="${i}" ${(x?.days||EVERY).includes(i)?'checked':''}><span>${d}</span></label>`).join('')}</div></div><div class="field hidden" id="start-field"><label for="start">Início do tratamento</label><input type="date" id="start" name="start" value="${x?.start||state.simDate}"></div><div class="field hidden" id="duration-field"><label for="duration">Duração em dias</label><input type="number" min="1" id="duration" name="duration" value="${x?.duration||7}"></div><div class="field" id="control-field"><label for="lead">Prazo para comprar antes de acabar</label><select id="lead" name="lead"><option value="5" ${(x?.lead||5)===5?'selected':''}>5 dias</option><option value="10" ${x?.lead===10?'selected':''}>10 dias (receita controlada)</option></select></div><div class="field"><label for="minStock">Estoque mínimo para alerta</label><input id="minStock" name="minStock" type="number" min="0" value="${x?.minStock??4}"></div></div></div><div class="field full hidden" id="sos-fields"><div class="form-grid"><div class="field"><label for="indication">Indicação</label><input id="indication" name="indication" value="${esc(x?.indication||'')}" placeholder="Ex.: dor ou febre"></div><div class="field"><label const close=()=>document.getElementById('modal-root').replaceChildren(),sync=()=>{let type=document.getElementById('kind').value,sos=type==='sos',temp=type==='temporary',mode=document.getElementById('scheduleMode').value,popular=document.getElementById('popular').checked;if(sos)document.getElementById('category').value='medication';let category=document.getElementById('category').value;document.getElementById('schedule-fields').classList.toggle('hidden',sos);document.getElementById('category-field').classList.toggle('hidden',sos);document.getElementById('control-class-field').classList.toggle('hidden',category!=='medication');document.getElementById('popular-field').classList.toggle('hidden',sos);document.getElementById('popular-date-field').classList.toggle('hidden',sos||!popular);document.getElementById('sos-fields').classList.toggle('hidden',!sos);document.getElementById('days-field').classList.toggle('hidden',sos);document.getElementById('times-field').classList.toggle('hidden',mode!=='clock');document.getElementById('slots-field').classList.toggle('hidden',mode!=='slots');document.getElementById('start-field').classList.toggle('hidden',!temp);document.getElementById('duration-field').classList.toggle('hidden',!temp);document.getElementById('control-field').classList.toggle('hidden',sos||temp)};document.getElementById('kind').onchange=sync;document.getElementById('scheduleMode').onchange=sync;document.getElementById('category').onchange=sync;document.getElementById('popular').onchange=sync;sync();document.getElementById('close-modal').onclick=close;document.getElementById('cancel').onclick=close;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};document.getElementById('item-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),type=f.get('kind'),mode=f.get('scheduleMode'),times=(f.get('times')||'').split(',').map(s=>s.trim()).filter(s=>/^([01]\d|2[0-3]):[0-5]\d$/.test(s)).sort(),slots=f.getAll('slots'),days=f.getAll('days').map(Number);if(type!=='sos'&&mode==='clock'&&!times.length){toast('Informe ao menos um horário HH:MM válido.');return}if(type!=='sos'&&mode==='slots'&&!slots.length){toast('Selecione ao menos um momento do dia.');return}if(type!=='sos'&&!days.length){toast('Selecione ao menos um dia da semana.');return}let raw=f.get('stock'),data={name:f.get('name').trim(),detail:f.get('detail').trim(),purpose:(f.get('purpose')||'').trim()||'Finalidade não indicada no quadro enviado.',kind:type,stock:raw===''?null:Number(raw),unit:f.get('unit').trim(),dose:Number(f.get('dose')),category:type==='sos'?'medication':(f.get('category')||'medication'),controlStatus:f.get('controlStatus')||'pending',popular:type!=='sos'&&f.get('popular')==='on',popularDate:type!=='sos'&&f.get('popular')==='on'?(f.get('popularDate')||''):'',minStock:Number(f.get('minStock')||4)};if(type==='sos')Object.assign(data,{indication:f.get('indication').trim(),interval:Number(f.get('interval')),max24:Number(f.get('max24')),lastDoses:x?.lastDoses||[]});else Object.assign(data,{scheduleMode:mode,slots:mode==='slots'?slots:[],times:mode==='clock'?times:[],days,lead:Number(f.get('lead')||5),paused:x?.paused||false,pausedAt:x?.pausedAt||'',pauseHistory:x?.pauseHistory||[],instructions:x?.instructions||''});if(type==='temporary')Object.assign(data,{start:f.get('start'),duration:Number(f.get('duration'))});if(x)Object.assign(x,data);else state.items.push({id:uid(),...data});close();render();toast(x?'Alterações salvas.':'Item adicionado à rotina.')};document.getElementById('name').focus()}
